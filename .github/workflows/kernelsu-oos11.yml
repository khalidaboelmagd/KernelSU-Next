name: Build OnePlus-Sm8150-Kernel-OOS11

on:
  workflow_dispatch:
  push:
    branches: [main, fix/ksun-susfs]

env:
  # KSU_NEXT_TAG is resolved at build time to the LATEST tag matching
  # the legacy line (vX.Y.Z-legacy, excluding susfs variants because
  # SUSFS requires shims on this 4.14 msm tree). See "Resolve latest
  # KSU-Next legacy tag" step. Override here to pin to a specific tag
  # if a new legacy release regresses on OP7Pro.
  KERNEL_DEFCONFIG: blu_spark_defconfig
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"
  CCACHE_HARDLINK: "true"

permissions:
  contents: write   # required for softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/dotnet "$AGENT_TOOLSDIRECTORY" || true

      - name: Install toolchain + deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang-14 lld-14 \
            binutils make python3 libssl-dev build-essential bc bison flex \
            unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler \
            git git-lfs patch
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64
          git clone --depth=1 -b oneplus7 https://github.com/snowwolf725/AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Resolve latest KSU-Next legacy tag
        id: ksun_tag
        run: |
          set -euo pipefail
          TAG=$(curl -sSf 'https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags?per_page=100' \
            | jq -r '.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-legacy$"))' \
            | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "FAIL: could not resolve latest KSU-Next legacy tag"
            exit 1
          fi
          echo "Resolved latest KSU-Next legacy tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Integrate KernelSU-Next (${{ steps.ksun_tag.outputs.TAG }})
        id: ksun_integrate
        env:
          KSU_NEXT_TAG: ${{ steps.ksun_tag.outputs.TAG }}
        run: |
          set -euo pipefail
          # Clean any prior integration attempts so setup.sh has a fresh tree
          rm -rf KernelSU-Next drivers/kernelsu
          curl -LSsf "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_TAG}/kernel/setup.sh" \
            | bash -s "${KSU_NEXT_TAG}"
          test -d KernelSU-Next
          echo "### KernelSU-Next commit:"
          git -C KernelSU-Next log -1 --oneline || true
          # Compute the driver version code the same way KSU-Next's Kbuild
          # does. The formula constants drift per tag (v3.1.0-legacy used
          # 30000+count+119; v3.2.0-legacy uses 30000+count+150). Parse the
          # base and offset directly out of KernelSU-Next/kernel/Kbuild so
          # this stays correct whatever future tags publish.
          COUNT=$(git -C KernelSU-Next rev-list --count HEAD)
          # line looks like: $(eval KSU_VERSION=$(shell expr 30000 + $(KSU_GIT_VERSION) + 150))
          FORMULA=$(grep -E 'expr [0-9]+ \+ \$\(KSU_GIT_VERSION\) \+ [0-9]+' \
                    KernelSU-Next/kernel/Kbuild | head -1)
          BASE=$(  echo "$FORMULA" | sed -E 's/.*expr ([0-9]+) \+.*/\1/')
          OFFSET=$(echo "$FORMULA" | sed -E 's/.*\+ ([0-9]+)\)\).*/\1/')
          if [ -z "$BASE" ] || [ -z "$OFFSET" ]; then
            echo "FAIL: could not parse KSU_VERSION formula from Kbuild"
            echo "  formula line was: $FORMULA"
            exit 1
          fi
          VERCODE=$(( BASE + COUNT + OFFSET ))
          echo "KSU-Next driver version code: ${VERCODE}"
          echo "  formula: ${BASE} + ${COUNT} + ${OFFSET}"
          echo "  tag:     ${KSU_NEXT_TAG}"
          echo "VERCODE=${VERCODE}" >> "$GITHUB_OUTPUT"

      - name: Configure + verify .config
        run: |
          set -euo pipefail
          export PATH="$(pwd)/aarch64/bin:$PATH"
          make ARCH=arm64 O=out \
            CC="ccache clang-14" LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${KERNEL_DEFCONFIG}"
          echo "### Verifying required configs survived Kconfig:"
          # KSU_KPROBES_HOOK must be auto-selected (kernel has KPROBES=y and
          # this tree does not carry manual ksu_handle_* call sites). If it
          # is not =y the driver has no hooks and root grant will silently
          # fail or panic — bail out now rather than ship a broken kernel.
          for k in CONFIG_KSU CONFIG_KSU_KPROBES_HOOK CONFIG_KRETPROBES \
                   CONFIG_KPROBES CONFIG_HAVE_SYSCALL_TRACEPOINTS; do
            if ! grep -qE "^${k}=y" out/.config; then
              echo "FAIL: ${k} is not set in out/.config"
              grep -E "${k}" out/.config || echo "  (not present at all)"
              exit 1
            fi
          done
          echo "### Final KSU / KPROBES config:"
          grep -E "KSU|KPROBES|TRACEPOINTS" out/.config | sort || true
          # Guard: make sure SUSFS did NOT accidentally sneak in
          if grep -qE "^CONFIG_KSU_SUSFS" out/.config; then
            echo "FAIL: CONFIG_KSU_SUSFS is set but SUSFS integration is disabled in this build"
            exit 1
          fi

      - name: Build kernel Image
        run: |
          set -euo pipefail
          export PATH="$(pwd)/aarch64/bin:$PATH"
          export KBUILD_BUILD_USER=khalid
          export KBUILD_BUILD_HOST=ksun-ci
          make ARCH=arm64 O=out \
            CC="ccache clang-14" LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc --all)"
          cp out/arch/arm64/boot/Image AnyKernel3/

      - name: Version + package AnyKernel3
        id: pack
        env:
          KSU_TAG: ${{ steps.ksun_tag.outputs.TAG }}
          KSU_VERCODE: ${{ steps.ksun_integrate.outputs.VERCODE }}
        run: |
          # Release identity derives from the KSU-Next tag + driver version
          # code. Date suffix keeps unique filenames across rebuilds of the
          # same tag so GitHub release upload never collides.
          DATE="$(date +%Y%m%d-%H%M)"
          TAG_BASE="OP7-OOS11-KSUN-${KSU_TAG}-${KSU_VERCODE}"      # e.g. OP7-OOS11-KSUN-v3.2.0-legacy-33129
          RELEASE_TAG="${TAG_BASE}-${DATE}"                        # unique git tag on the repo
          RELEASE_NAME="${TAG_BASE}"                               # pretty display name
          ZIP_NAME="${TAG_BASE}.zip"                               # user-facing zip file
          echo "TAG_BASE=${TAG_BASE}"         >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}"   >> "$GITHUB_OUTPUT"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=${ZIP_NAME}"         >> "$GITHUB_OUTPUT"
          cd AnyKernel3
          zip -r "../${ZIP_NAME}" *
          cd ..
          ls -la "${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.TAG_BASE }}
          path: ${{ steps.pack.outputs.ZIP_NAME }}

      - name: Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.ZIP_NAME }}
          name: ${{ steps.pack.outputs.RELEASE_NAME }}
          tag_name: ${{ steps.pack.outputs.RELEASE_TAG }}
          body: |
            Device: OnePlus 7 / 7Pro / 7T / 7TPro
            Target: OxygenOS 11
            KernelSU-Next tag: ${{ steps.ksun_tag.outputs.TAG }} (auto-resolved latest legacy)
            KernelSU-Next driver version code: ${{ steps.ksun_integrate.outputs.VERCODE }}
            SUSFS: disabled (add in follow-up once root grant is stable)
            Build: ${{ steps.pack.outputs.RELEASE_TAG }}
        # Uses the built-in GITHUB_TOKEN (granted contents:write at the
        # workflow level above). No repo secret required.
