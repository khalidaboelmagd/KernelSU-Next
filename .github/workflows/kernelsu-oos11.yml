name: Build OnePlus-Sm8150-Kernel-OOS11

on:
  workflow_dispatch:
  push:
    branches: [main, fix/ksun-susfs, feat/full-susfs]

env:
  # KSU_NEXT_TAG is resolved at build time to the LATEST tag matching
  # the legacy line (vX.Y.Z-legacy, excluding susfs variants because
  # SUSFS requires shims on this 4.14 msm tree). See "Resolve latest
  # KSU-Next legacy tag" step. Override here to pin to a specific tag
  # if a new legacy release regresses on OP7Pro.
  KERNEL_DEFCONFIG: blu_spark_defconfig
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"
  CCACHE_HARDLINK: "true"

permissions:
  contents: write   # required for softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/dotnet "$AGENT_TOOLSDIRECTORY" || true

      - name: Install toolchain + deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang-14 lld-14 \
            binutils make python3 libssl-dev build-essential bc bison flex \
            unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler \
            git git-lfs patch
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64
          git clone --depth=1 -b oneplus7 https://github.com/snowwolf725/AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Resolve latest KSU-Next legacy-susfs tag
        id: ksun_tag
        run: |
          set -euo pipefail
          # On feat/full-susfs branch we want the legacy-susfs variant of
          # KSU-Next (driver has the SUSFS calls baked in). On other
          # branches, fall back to the plain legacy line.
          if [ "${GITHUB_REF_NAME:-}" = "feat/full-susfs" ]; then
            PATTERN='^v[0-9]+\\.[0-9]+\\.[0-9]+-legacy-susfs$'
          else
            PATTERN='^v[0-9]+\\.[0-9]+\\.[0-9]+-legacy$'
          fi
          TAG=$(curl -sSf 'https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags?per_page=100' \
            | jq -r --arg p "$PATTERN" '.[].name | select(test($p))' \
            | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "FAIL: could not resolve latest KSU-Next tag for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Resolved KSU-Next tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Integrate KernelSU-Next (${{ steps.ksun_tag.outputs.TAG }})
        env:
          KSU_NEXT_TAG: ${{ steps.ksun_tag.outputs.TAG }}
        run: |
          set -euo pipefail
          # Clean any prior integration attempts so setup.sh has a fresh tree
          rm -rf KernelSU-Next drivers/kernelsu
          curl -LSsf "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_TAG}/kernel/setup.sh" \
            | bash -s "${KSU_NEXT_TAG}"
          test -d KernelSU-Next
          echo "### KernelSU-Next commit:"
          git -C KernelSU-Next log -1 --oneline || true

      - name: Integrate SUSFS (Frankenstein 4.14 + 5.10 attempt)
        if: github.ref_name == 'feat/full-susfs'
        run: |
          set -euo pipefail
          # Strategy: KSU-Next v3.1.0-legacy-susfs needs ~33 susfs
          # functions but susfs4ksu kernel-4.14 branch only provides
          # ~15. The newer gki-android12-5.10 branch provides them all,
          # so we take susfs.c + headers from there and the kernel-side
          # hook patch from kernel-4.14 (since fs/* internals differ).
          rm -rf susfs-414 susfs-510
          git clone --depth=1 -b kernel-4.14 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs-414
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs-510
          # Take SUSFS implementation from 5.10 (full API coverage)
          cp susfs-510/kernel_patches/fs/susfs.c                fs/
          cp susfs-510/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs-510/kernel_patches/include/linux/susfs_def.h include/linux/
          # Apply 4.14-specific hooks (touches fs/Makefile, fs/namei.c,
          # fs/dcache.c, fs/stat.c, etc — kernel internals only)
          patch -p1 --forward --fuzz=3 \
            < susfs-414/kernel_patches/50_add_susfs_in_kernel-4.14.patch
          # 4.14 lacks inotify_mark_user_mask helper; use the equivalent
          # mainline expression that existed before that helper was
          # factored out.
          if grep -q "inotify_mark_user_mask" fs/notify/fdinfo.c; then
            sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
            ! grep -q "inotify_mark_user_mask" fs/notify/fdinfo.c
          fi
          echo "### SUSFS integrated. Will see what compiles."

      - name: Configure + verify .config
        run: |
          set -euo pipefail
          export PATH="$(pwd)/aarch64/bin:$PATH"
          make ARCH=arm64 O=out \
            CC="ccache clang-14" LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${KERNEL_DEFCONFIG}"
          echo "### Verifying required configs survived Kconfig:"
          # KSU_KPROBES_HOOK must be auto-selected (kernel has KPROBES=y and
          # this tree does not carry manual ksu_handle_* call sites). If it
          # is not =y the driver has no hooks and root grant will silently
          # fail or panic — bail out now rather than ship a broken kernel.
          REQUIRED="CONFIG_KSU CONFIG_KSU_KPROBES_HOOK CONFIG_KRETPROBES CONFIG_KPROBES CONFIG_HAVE_SYSCALL_TRACEPOINTS"
          if [ "${GITHUB_REF_NAME:-}" = "feat/full-susfs" ]; then
            REQUIRED="$REQUIRED CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME"
          fi
          for k in $REQUIRED; do
            if ! grep -qE "^${k}=y" out/.config; then
              echo "FAIL: ${k} is not set in out/.config"
              grep -E "${k}" out/.config || echo "  (not present at all)"
              exit 1
            fi
          done
          echo "### Final KSU / SUSFS / KPROBES config:"
          grep -E "KSU|SUSFS|KPROBES|TRACEPOINTS" out/.config | sort || true
          # Guard: SUSFS should not be set on non-susfs branches
          if [ "${GITHUB_REF_NAME:-}" != "feat/full-susfs" ] && grep -qE "^CONFIG_KSU_SUSFS" out/.config; then
            echo "FAIL: CONFIG_KSU_SUSFS is set but SUSFS integration is disabled on this branch"
            exit 1
          fi

      - name: Build kernel Image
        run: |
          set -euo pipefail
          export PATH="$(pwd)/aarch64/bin:$PATH"
          export KBUILD_BUILD_USER=khalid
          export KBUILD_BUILD_HOST=ksun-ci
          make ARCH=arm64 O=out \
            CC="ccache clang-14" LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc --all)"
          cp out/arch/arm64/boot/Image AnyKernel3/

      - name: Version + package AnyKernel3
        id: pack
        run: |
          VERSION="$(date +%Y%m%d-%H%M)"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          cd AnyKernel3
          zip -r "../OP7-OOS11-KSUN-${VERSION}.zip" *
          cd ..
          ls -la OP7-OOS11-KSUN-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OP7-OOS11-KSUN-${{ steps.pack.outputs.VERSION }}
          path: OP7-OOS11-KSUN-*.zip

      - name: Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: OP7-OOS11-KSUN-*.zip
          name: OP7-OOS11-KSUN-${{ steps.pack.outputs.VERSION }}
          tag_name: ${{ steps.pack.outputs.VERSION }}
          body: |
            Device: OnePlus 7 / 7Pro / 7T / 7TPro
            Target: OxygenOS 11
            KernelSU-Next: ${{ steps.ksun_tag.outputs.TAG }} (auto-latest legacy)
            SUSFS: disabled (add in follow-up once root grant is stable)
        # Uses the built-in GITHUB_TOKEN (granted contents:write at the
        # workflow level above). No repo secret required.
